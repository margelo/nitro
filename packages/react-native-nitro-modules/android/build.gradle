buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:9.3.1"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

if (rootProject.findProperty("newArchEnabled")?.toString() == "false") {
  throw new GradleException("Nitro Modules requires the React Native New Architecture. Set newArchEnabled=true in gradle.properties.")
}

apply plugin: "com.android.library"
apply plugin: 'org.jetbrains.kotlin.android'
apply from: "./fix-prefab.gradle"

apply plugin: "com.facebook.react"

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["Nitro_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["Nitro_" + name]).toInteger()
}

logger.warn("[NitroModules] 🔥 Your app is boosted by nitro modules!")

android {
  namespace "com.margelo.nitro"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    prefab true
    prefabPublishing true
  }

  packagingOptions {
    excludes = [
            "META-INF",
            "META-INF/**",
            "**/libc++_shared.so",
            "**/libfbjni.so",
            "**/libjsi.so",
            "**/libfolly_json.so",
            "**/libfolly_runtime.so",
            "**/libglog.so",
            "**/libhermes.so",
            "**/libhermes-executor-debug.so",
            "**/libhermes_executor.so",
            "**/libreactnative.so",
            "**/libreactnativejni.so",
            "**/libturbomodulejsijni.so",
            "**/libreact_nativemodule_core.so",
            "**/libjscexecutor.so"
    ]
  }

  prefab {
    NitroModules {
      headers "${project.buildDir}/headers/nitromodules/"
    }
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += ["core/main/java"]
      java.srcDirs += ["${project.buildDir}/generated/source/codegen/java"]
    }
  }
}

repositories {
  mavenCentral()
  google()
}


dependencies {
  // The React Native Gradle plugin supplies the version.
  implementation "com.facebook.react:react-android"
  // Only compiles AnyJSON+Serialization.kt and is not shipped to apps. Modules that call
  // AnyJSON.encode/decode add kotlinx-serialization-json themselves. Every app compiles this
  // module with its own Kotlin, which reads metadata at most one minor version newer than
  // itself, so keep this version old.
  compileOnly "org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1"
}

react {
  jsRootDir = file("../src/")
  libraryName = "NitroModules"
  codegenJavaPackageName = "com.margelo.nitro"
}

tasks.register('prepareHeaders', Sync) {
  from(['./src/main/cpp', './core/main/cpp']) {
    include '**/*.hpp'
    eachFile { path = "NitroModules/${name}" }
  }
  from('../cpp/core/include') { include '**/*.hpp' }
  from('../include') { include '**/*.hpp' }
  into "${project.buildDir}/headers/nitromodules/"
  includeEmptyDirs = false
  duplicatesStrategy = DuplicatesStrategy.FAIL
}

preBuild.dependsOn(prepareHeaders)
