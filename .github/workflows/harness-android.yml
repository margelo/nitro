name: Harness Android

concurrency:
  group: harness-android-${{ inputs.ref && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string
  workflow_dispatch:
    inputs:
      redroid_probe:
        description: "Only probe Redroid support on the hosted runner"
        type: boolean
        default: false
      device_api_level:
        description: "Android API level"
        required: false
        type: string
      device_profile:
        description: "Device profile"
        required: false
        default: "pixel_7"
        type: string
      avd_name:
        description: "AVD name"
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/harness-android.yml'
      - 'packages/nitro-core/**'
      - 'packages/nitrogen/**'
      - 'packages/react-native-nitro-modules/**'
      - 'tests/react-native/**'
      - 'scripts/sync-core.mjs'
      - 'scripts/core-package.mjs'
      - 'scripts/set-version.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'scripts/releases/**'
      - 'config/**'

env:
  DEVICE_ARCH: x86_64
  DEVICE_PROFILE: ${{ github.event.inputs.device_profile || 'pixel_7' }}
  AVD_DISK_SIZE: 1G
  AVD_HEAP_SIZE: 1G

jobs:
  redroid_probe:
    name: Probe Redroid
    if: ${{ inputs.redroid_probe == true }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Inspect Android kernel support
        run: |
          uname -a
          printf 'ImageVersion=%s\n' "$ImageVersion"
          modinfo binder_linux
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          find /dev -maxdepth 2 -iname "*binder*"
          cat /proc/filesystems
      - name: Start Redroid
        run: |
          date -u +%FT%T.%NZ
          docker run --detach --privileged --name nitro-redroid \
            --publish 127.0.0.1:5555:5555 \
            redroid/redroid:16.0.0_64only-latest \
            androidboot.use_memfd=true \
            androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=1080 \
            androidboot.redroid_height=2400 \
            androidboot.redroid_dpi=420
          date -u +%FT%T.%NZ
      - name: Wait for Android readiness
        run: |
          adb start-server
          for attempt in $(seq 1 90); do
            adb connect 127.0.0.1:5555
            booted=$(timeout 5 adb -s 127.0.0.1:5555 shell getprop sys.boot_completed | tr -d '\r')
            if [ "$booted" = 1 ]; then
              timeout 10 adb -s 127.0.0.1:5555 shell pm path android
              adb -s 127.0.0.1:5555 shell getprop ro.product.manufacturer
              adb -s 127.0.0.1:5555 shell getprop ro.product.model
              adb -s 127.0.0.1:5555 shell getprop ro.build.version.sdk
              adb -s 127.0.0.1:5555 shell wm size
              adb -s 127.0.0.1:5555 shell wm density
              date -u +%FT%T.%NZ
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Collect Redroid diagnostics
        if: always()
        run: |
          docker ps -a
          docker logs nitro-redroid || true
          docker inspect nitro-redroid || true
          docker exec nitro-redroid logcat -d -t 150 || true
          docker rm -f nitro-redroid || true
  harness_android_new:
    if: ${{ inputs.redroid_probe != true }}
    name: Harness Android
    runs-on: ubuntu-latest
    env:
      DEVICE_API_LEVEL: ${{ github.event.inputs.device_api_level || '36' }}
      AVD_NAME: ${{ github.event.inputs.avd_name || 'Pixel_7_API_36' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Reclaim disk space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install npm dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Generate test bindings
        run: bun specs

      - name: Set minSdk in build.gradle
        run: sed -i "s/minSdkVersion = 24/minSdkVersion = 26/g" tests/react-native/apps/example/android/build.gradle

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: 17
          java-package: jdk

      - name: Restore Gradle/CMake cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            tests/react-native/apps/example/android/.gradle
            tests/react-native/apps/example/android/app/.cxx
          key: ${{ runner.os }}-gradle-26-${{ env.DEVICE_ARCH }}-Default-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-gradle-26-${{ env.DEVICE_ARCH }}-Default-
      - name: Build React Native Android app
        working-directory: tests/react-native/apps/example/android
        run: ./gradlew :app:assembleDebug --no-daemon --build-cache -PreactNativeArchitectures=${{ env.DEVICE_ARCH }}

      - name: Run Harness E2E tests
        uses: callstackincubator/react-native-harness@v1.5.0
        with:
          runner: android
          projectRoot: tests/react-native/apps/example
          app: android/app/build/outputs/apk/debug/app-debug.apk
          packageManager: bun

      - name: Print native crash reports
        if: failure()
        working-directory: tests/react-native/apps/example
        shell: bash
        run: |
          [ -d .harness/crash-reports ] || exit 0
          find .harness/crash-reports -type f | sort | while read -r report; do
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done

      # Gradle cache doesn't like daemons
      - name: Stop Gradle Daemon
        working-directory: tests/react-native/apps/example/android
        run: ./gradlew --stop
