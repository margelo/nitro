name: Harness Android

concurrency:
  group: harness-android-${{ github.event_name == 'workflow_dispatch' && github.run_id || inputs.ref && github.run_id || github.ref }}-${{ inputs.redroid_probe && 'probe' || inputs.prepare_redroid_image && 'image' || inputs.compare_devices && 'comparison' || inputs.device_backend || 'emulator' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string
  workflow_dispatch:
    inputs:
      device_backend:
        description: "Android device for the complete build and test workflow"
        type: choice
        options: [emulator, redroid]
        default: emulator
      prepare_redroid_image:
        description: "Build and publish the prepared Redroid image separately"
        type: boolean
        default: false
      redroid_image:
        description: "Prepared Redroid image reference"
        type: string
        default: ghcr.io/margelo/nitro-harness-redroid:android16-ashmem-1ec533f-ubuntu26
      apk_run_id:
        description: "Reuse the shared APK from an earlier comparison run"
        type: string
        required: false
      compare_devices:
        description: "Build one APK and compare the emulator with Redroid"
        type: boolean
        default: false
      redroid_probe:
        description: "Only probe Redroid support on the hosted runner"
        type: boolean
        default: false
      device_api_level:
        description: "Android API level"
        required: false
        type: string
      device_profile:
        description: "Device profile"
        required: false
        default: "pixel_7"
        type: string
      avd_name:
        description: "AVD name"
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/harness-android.yml'
      - 'packages/nitro-core/**'
      - 'packages/nitrogen/**'
      - 'packages/react-native-nitro-modules/**'
      - 'tests/react-native/**'
      - 'scripts/sync-core.mjs'
      - 'scripts/core-package.mjs'
      - 'scripts/set-version.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'scripts/releases/**'
      - 'config/**'

env:
  DEVICE_ARCH: x86_64
  DEVICE_PROFILE: ${{ github.event.inputs.device_profile || 'pixel_7' }}
  AVD_DISK_SIZE: 1G
  AVD_HEAP_SIZE: 1G

jobs:
  prepare_redroid_image:
    name: Prepare Redroid image
    if: ${{ inputs.prepare_redroid_image == true }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/prepare-redroid-image.yml
  redroid_probe:
    name: Probe Redroid
    permissions:
      contents: read
      packages: read
    env:
      REDROID_IMAGE: ${{ inputs.redroid_image }}
    if: ${{ inputs.redroid_probe == true }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Inspect runner
        run: |
          uname -a
          printf 'ImageVersion=%s\n' "$ImageVersion"
          modinfo binder_linux
          ls -l "$ANDROID_HOME/platform-tools/adb"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Sign in to the image registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Start Redroid
        run: bash scripts/ci/redroid.sh start "$RUNNER_TEMP/harness-profile"
      - name: Wait for Android readiness
        run: |
          bash scripts/ci/redroid.sh wait "$RUNNER_TEMP/harness-profile"
          adb -s 127.0.0.1:5555 shell getprop ro.product.manufacturer
          adb -s 127.0.0.1:5555 shell getprop ro.product.model
          adb -s 127.0.0.1:5555 shell getprop ro.build.version.sdk
          adb -s 127.0.0.1:5555 shell wm size
          adb -s 127.0.0.1:5555 shell wm density
      - name: Collect Redroid diagnostics
        if: always()
        run: |
          bash scripts/ci/redroid.sh collect "$RUNNER_TEMP/harness-profile"
          cat "$RUNNER_TEMP/harness-profile/redroid-timings.tsv"
          cat "$RUNNER_TEMP/harness-profile/redroid-image.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: redroid-probe
          path: ${{ runner.temp }}/harness-profile
          retention-days: 7
      - name: Stop Redroid
        if: always()
        run: bash scripts/ci/redroid.sh stop "$RUNNER_TEMP/harness-profile"
  harness_android_new:
    if: ${{ inputs.redroid_probe != true && inputs.prepare_redroid_image != true }}
    name: Harness Android
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      apk_artifact_id: ${{ steps.upload-apk.outputs.artifact-id }}
    env:
      DEVICE_BACKEND: ${{ inputs.device_backend || 'emulator' }}
      DEVICE_REPEAT: '1'
      REDROID_IMAGE: ${{ inputs.redroid_image }}
      RN_HARNESS_DIAGNOSTICS: '1'
      HARNESS_DEBUG: '1'
      DEVICE_API_LEVEL: ${{ github.event.inputs.device_api_level || '36' }}
      AVD_NAME: ${{ github.event.inputs.avd_name || 'Pixel_7_API_36' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Initialize full-run profiling
        if: ${{ inputs.compare_devices != true }}
        run: |
          PROFILE_DIR="$RUNNER_TEMP/harness-profile"
          mkdir -p "$PROFILE_DIR"
          printf 'PROFILE_DIR=%s\n' "$PROFILE_DIR" >> "$GITHUB_ENV"
          printf 'APK_DIR=%s/tests/react-native/apps/example/android/app/build/outputs/apk/debug\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          python3 "$GITHUB_WORKSPACE/scripts/ci/monotonic-ms.py" > "$PROFILE_DIR/profile-started-ms"
          printf 'phase\tstarted_ms\tfinished_ms\tduration_ms\n' > "$PROFILE_DIR/workflow-timings.tsv"
          uname -a > "$PROFILE_DIR/runner-kernel.txt"

      - name: Reclaim disk space
        if: ${{ inputs.apk_run_id == '' }}
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Add Android platform tools to PATH
        if: ${{ inputs.device_backend == 'redroid' && inputs.compare_devices != true }}
        run: |
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Sign in to the image registry
        if: ${{ inputs.device_backend == 'redroid' && inputs.compare_devices != true }}
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Start Redroid during dependencies and app build
        if: ${{ inputs.device_backend == 'redroid' && inputs.compare_devices != true }}
        run: bash scripts/ci/redroid.sh start "$PROFILE_DIR"

      - uses: oven-sh/setup-bun@v2
        if: ${{ inputs.apk_run_id == '' }}
        with:
          bun-version-file: package.json

      - name: Install npm dependencies (bun)
        if: ${{ inputs.apk_run_id == '' }}
        run: |
          started_ms=$(python3 "$GITHUB_WORKSPACE/scripts/ci/monotonic-ms.py")
          bun install --frozen-lockfile
          if [ "${{ inputs.compare_devices }}" != true ]; then
            finished_ms=$(python3 "$GITHUB_WORKSPACE/scripts/ci/monotonic-ms.py")
            duration_ms=$((finished_ms - started_ms))
            printf 'dependencies\t%s\t%s\t%s\n' "$started_ms" "$finished_ms" "$duration_ms" >> "$PROFILE_DIR/workflow-timings.tsv"
          fi

      - name: Generate test bindings
        if: ${{ inputs.apk_run_id == '' }}
        run: bun specs

      - name: Set minSdk in build.gradle
        if: ${{ inputs.apk_run_id == '' }}
        run: sed -i "s/minSdkVersion = 24/minSdkVersion = 26/g" tests/react-native/apps/example/android/build.gradle

      - name: Setup JDK 17
        if: ${{ inputs.apk_run_id == '' }}
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: 17
          java-package: jdk

      - name: Restore Gradle/CMake cache
        if: ${{ inputs.apk_run_id == '' }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            tests/react-native/apps/example/android/.gradle
            tests/react-native/apps/example/android/app/.cxx
          key: ${{ runner.os }}-gradle-26-${{ env.DEVICE_ARCH }}-Default-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-gradle-26-${{ env.DEVICE_ARCH }}-Default-
      - name: Build React Native Android app
        if: ${{ inputs.apk_run_id == '' }}
        working-directory: tests/react-native/apps/example/android
        run: |
          started_ms=$(python3 "$GITHUB_WORKSPACE/scripts/ci/monotonic-ms.py")
          ./gradlew :app:assembleDebug --no-daemon --build-cache -PreactNativeArchitectures=${{ env.DEVICE_ARCH }}
          if [ "${{ inputs.compare_devices }}" != true ]; then
            finished_ms=$(python3 "$GITHUB_WORKSPACE/scripts/ci/monotonic-ms.py")
            duration_ms=$((finished_ms - started_ms))
            printf 'app_build\t%s\t%s\t%s\n' "$started_ms" "$finished_ms" "$duration_ms" >> "$PROFILE_DIR/workflow-timings.tsv"
          fi

      - name: Reuse the shared APK
        if: ${{ inputs.apk_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: harness-android-measurement-apk
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ github.token }}
          path: tests/react-native/apps/example/android/app/build/outputs/apk/debug

      - name: Hash measurement APK
        if: ${{ inputs.compare_devices == true }}
        working-directory: tests/react-native/apps/example/android/app/build/outputs/apk/debug
        run: sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Upload measurement APK
        id: upload-apk
        if: ${{ inputs.compare_devices == true }}
        uses: actions/upload-artifact@v7
        with:
          name: harness-android-measurement-apk
          path: |
            tests/react-native/apps/example/android/app/build/outputs/apk/debug/app-debug.apk
            tests/react-native/apps/example/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 7

      - name: Hash the full-run APK
        if: ${{ inputs.compare_devices != true }}
        working-directory: ${{ env.APK_DIR }}
        run: sha256sum app-debug.apk > "$PROFILE_DIR/apk-sha256.txt"

      - name: Wait for Redroid and install the app
        if: ${{ inputs.device_backend == 'redroid' && inputs.compare_devices != true }}
        run: |
          bash scripts/ci/redroid.sh wait "$PROFILE_DIR"
          manufacturer=$(adb -s 127.0.0.1:5555 shell getprop ro.product.manufacturer)
          model=$(adb -s 127.0.0.1:5555 shell getprop ro.product.model)
          printf 'REDROID_MANUFACTURER=%s\n' "${manufacturer//$'\r'/}" >> "$GITHUB_ENV"
          printf 'REDROID_MODEL=%s\n' "${model//$'\r'/}" >> "$GITHUB_ENV"
          started_ms=$(python3 "$GITHUB_WORKSPACE/scripts/ci/monotonic-ms.py")
          adb -s 127.0.0.1:5555 install -r "$APK_DIR/app-debug.apk"
          finished_ms=$(python3 "$GITHUB_WORKSPACE/scripts/ci/monotonic-ms.py")
          duration_ms=$((finished_ms - started_ms))
          printf 'apk_install\t%s\t%s\t%s\n' "$started_ms" "$finished_ms" "$duration_ms" >> "$PROFILE_DIR/workflow-timings.tsv"

      - name: Select the Redroid configuration
        if: ${{ inputs.device_backend == 'redroid' && inputs.compare_devices != true }}
        working-directory: tests/react-native/apps/example
        run: |
          mv rn-harness.config.mjs rn-harness.baseline.config.mjs
          cp rn-harness.redroid.config.mjs rn-harness.config.mjs

      - name: Record Harness start
        if: ${{ inputs.compare_devices != true }}
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/monotonic-ms.py" > "$PROFILE_DIR/harness-action-started-ms"

      - name: Run Harness E2E tests
        id: harness
        if: ${{ inputs.compare_devices != true }}
        uses: callstackincubator/react-native-harness@v1.5.0
        with:
          runner: android
          projectRoot: tests/react-native/apps/example
          app: android/app/build/outputs/apk/debug/app-debug.apk
          packageManager: bun

      - name: Print native crash reports
        if: failure()
        working-directory: tests/react-native/apps/example
        shell: bash
        run: |
          [ -d .harness/crash-reports ] || exit 0
          find .harness/crash-reports -type f | sort | while read -r report; do
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done

      - name: Summarize full-run diagnostics
        if: ${{ always() && inputs.compare_devices != true }}
        env:
          HARNESS_OUTCOME: ${{ steps.harness.outcome }}
        run: |
          node scripts/ci/summarize-harness-diagnostics.mjs "$PROFILE_DIR" tests/react-native/apps/example/.harness/diagnostics
          for directory in diagnostics crash-reports; do
            source_dir="tests/react-native/apps/example/.harness/$directory"
            if [ -d "$source_dir" ]; then
              cp -R "$source_dir" "$PROFILE_DIR/$directory"
            fi
          done

      - name: Collect Redroid diagnostics
        if: ${{ always() && inputs.device_backend == 'redroid' && inputs.compare_devices != true }}
        run: bash scripts/ci/redroid.sh collect "$PROFILE_DIR"

      - name: Stop Redroid
        if: ${{ always() && inputs.device_backend == 'redroid' && inputs.compare_devices != true }}
        run: bash scripts/ci/redroid.sh stop "$PROFILE_DIR"

      - name: Upload full-run measurements
        if: ${{ always() && inputs.compare_devices != true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-android-full-profile-${{ env.DEVICE_BACKEND }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROFILE_DIR }}
          if-no-files-found: error
          retention-days: 7

      # Gradle cache doesn't like daemons
      - name: Stop Gradle Daemon
        if: ${{ always() && inputs.apk_run_id == '' }}
        working-directory: tests/react-native/apps/example/android
        run: ./gradlew --stop

  compare_devices:
    name: Compare Android devices
    needs: harness_android_new
    if: ${{ inputs.compare_devices == true }}
    uses: ./.github/workflows/harness-android-device-comparison.yml
    with:
      artifact_id: ${{ needs.harness_android_new.outputs.apk_artifact_id }}
      redroid_image: ${{ inputs.redroid_image }}
