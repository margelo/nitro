name: Harness Android

concurrency:
  group:
    harness-android-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref_name != 'main' && github.ref ||
    github.run_id }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string
  workflow_dispatch:
    inputs:
      device_api_level:
        description: 'Android API level'
        required: false
        type: string
      device_profile:
        description: 'Device profile'
        required: false
        default: 'pixel_7'
        type: string
      avd_name:
        description: 'AVD name'
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/harness-android.yml'
      - 'packages/nitro-core/**'
      - 'packages/nitrogen/**'
      - 'packages/react-native-nitro-modules/**'
      - 'tests/react-native/**'
      - 'scripts/sync-core.mjs'
      - 'scripts/core-package.mjs'
      - 'scripts/set-version.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'scripts/releases/**'
      - 'config/**'

env:
  DEVICE_ARCH: x86_64
  DEVICE_PROFILE: ${{ github.event.inputs.device_profile || 'pixel_7' }}
  AVD_DISK_SIZE: 1G
  AVD_HEAP_SIZE: 1G

jobs:
  harness_android_new:
    name: Harness Android
    runs-on: ubuntu-latest
    env:
      DEVICE_API_LEVEL: ${{ github.event.inputs.device_api_level || '36' }}
      AVD_NAME: ${{ github.event.inputs.avd_name || 'Pixel_7_API_36' }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Reclaim disk space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install npm dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Generate test bindings
        run: bun specs

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17
          java-package: jdk

      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/v1' }}
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: android-harness
          max-size: 256M
          save: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1' }}
      - name: Build React Native Android app
        working-directory: tests/react-native/apps/example/android
        run: ./gradlew :app:assembleDebug --no-daemon --build-cache -PreactNativeArchitectures=${{ env.DEVICE_ARCH }}

      - name: Run Harness E2E tests
        uses: callstackincubator/react-native-harness@v1.6.0
        with:
          runner: android
          projectRoot: tests/react-native/apps/example
          app: android/app/build/outputs/apk/debug/app-debug.apk
          packageManager: bun
          cacheSavePolicy: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1') && 'always' || 'never' }}

      - name: Print native crash reports
        if: failure()
        working-directory: tests/react-native/apps/example
        shell: bash
        run: |
          [ -d .harness/crash-reports ] || exit 0
          find .harness/crash-reports -type f | sort | while read -r report; do
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done

      # Gradle cache doesn't like daemons
      - name: Stop Gradle Daemon
        working-directory: tests/react-native/apps/example/android
        run: ./gradlew --stop
