name: Harness iOS

concurrency:
  group:
    harness-ios-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref_name != 'main' && github.ref ||
    github.run_id }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string
  workflow_dispatch:
    inputs:
      device_model:
        description: 'iOS Simulator device model'
        required: false
        default: 'iPhone 18 Pro'
        type: string
      ios_version:
        description: 'iOS version'
        required: false
        default: '27.0'
        type: string
      xcode_version:
        description: 'Xcode version, or default for the selected Xcode'
        required: false
        default: '27.1'
        type: string
  pull_request:
    paths:
      - '.github/workflows/harness-ios.yml'
      - 'Package.swift'
      - 'Package.resolved'
      - 'packages/nitro-core/**'
      - 'packages/nitrogen/**'
      - 'packages/react-native-nitro-modules/**'
      - 'tests/react-native/**'
      - 'patches/@react-native-harness%2Fplatform-apple@*.patch'
      - 'patches/@react-native-harness%2Fui@*.patch'
      - 'scripts/sync-core.mjs'
      - 'scripts/core-package.mjs'
      - 'scripts/set-version.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'scripts/releases/**'
      - 'config/**'

env:
  # Device configuration - can be overridden by workflow_dispatch inputs
  DEVICE_MODEL: ${{ github.event.inputs.device_model || 'iPhone 18 Pro' }}
  IOS_VERSION: ${{ github.event.inputs.ios_version || '27.0' }}
  XCODE_VERSION: ${{ github.event.inputs.xcode_version || '27.1' }}
  HARNESS_DEBUG: 1

jobs:
  harness_ios_new:
    name: Harness iOS
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install npm dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Check Harness app detection
        run: bun test tests/react-native/apps/example/harness-apple.test.mjs

      - name: Generate test bindings
        run: bun specs

      - name: Select Xcode
        run: |
          if [ "$XCODE_VERSION" = "default" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          fi
          xcodebuild -version
          xcrun swift --version

      - name: Read native build cache inputs
        id: native
        run: |
          toolchain=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

      - name: Restore React Native and Hermes downloads
        id: downloads-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/ReactNative
          key: react-native-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - name: Restore compilation cache
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            tests/react-native/apps/example/ios/build/CompilationCache.noindex
            tests/react-native/apps/example/ios/build/SourcePackages
          key: react-native-ios-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native.outputs.toolchain }}-${{ inputs.ref || github.sha }}
          restore-keys: |
            react-native-ios-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native.outputs.toolchain }}-

      - name: Resolve Swift packages
        working-directory: tests/react-native/apps/example
        run: bun spm

      - name: Save React Native and Hermes downloads
        if: >-
          steps.downloads-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/v1')
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/ReactNative
          key: ${{ steps.downloads-cache.outputs.cache-primary-key }}

      - name: Build React Native iOS app
        working-directory: tests/react-native/apps/example/ios
        run: |
          set -o pipefail
          xcodebuild \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            COMPILATION_CACHE_LIMIT_SIZE=512M \
            -derivedDataPath build \
            -project NitroExample.xcodeproj \
            -scheme NitroExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -showBuildTimingSummary \
            ARCHS=arm64 \
            build \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Save compilation cache
        if: >-
          steps.native-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/v1')
        uses: actions/cache/save@v6
        with:
          path: |
            tests/react-native/apps/example/ios/build/CompilationCache.noindex
            tests/react-native/apps/example/ios/build/SourcePackages
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Install Watchman
        run: brew install watchman

      - name: Run Harness E2E tests
        uses: callstackincubator/react-native-harness@v1.6.0
        with:
          runner: ios
          projectRoot: tests/react-native/apps/example
          app: ios/build/Build/Products/Debug-iphonesimulator/NitroExample.app
          packageManager: bun
          cacheSavePolicy: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1') && 'always' || 'never' }}

      - name: Print native crash reports
        if: failure()
        working-directory: tests/react-native/apps/example
        shell: bash
        run: |
          # Harness only extracts crash logs it classifies as native crashes,
          # so also print the simulator's own crash reports.
          {
            [ -d .harness/crash-reports ] && find .harness/crash-reports -type f
            find ~/Library/Logs/DiagnosticReports -name 'NitroExample*.ips' 2>/dev/null
          } | sort | while read -r report; do
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done
