name: Harness iOS

concurrency:
  group: harness-ios-${{ inputs.ref && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string
  workflow_dispatch:
    inputs:
      device_model:
        description: "iOS Simulator device model"
        required: false
        default: "iPhone 17 Pro"
        type: string
      ios_version:
        description: "iOS version"
        required: false
        default: "26.5"
        type: string
      xcode_version:
        description: "Xcode version"
        required: false
        default: "26.5"
        type: string
  pull_request:
    paths:
      - '.github/workflows/harness-ios.yml'
      - 'packages/nitro-core/**'
      - 'packages/nitrogen/**'
      - 'packages/react-native-nitro-modules/**'
      - 'tests/react-native/**'
      - 'scripts/sync-core.mjs'
      - 'scripts/core-package.mjs'
      - 'scripts/set-version.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'scripts/releases/**'
      - 'config/**'

env:
  # Device configuration - can be overridden by workflow_dispatch inputs
  DEVICE_MODEL: ${{ github.event.inputs.device_model || 'iPhone 17 Pro' }}
  IOS_VERSION: ${{ github.event.inputs.ios_version || '26.5' }}
  XCODE_VERSION: ${{ github.event.inputs.xcode_version || '26.5' }}
  DEVELOPER_DIR: /Applications/Xcode_${{ github.event.inputs.xcode_version || '26.5' }}.app/Contents/Developer
  HARNESS_DEBUG: 1

jobs:
  harness_ios_new:
    name: Harness iOS
    runs-on: macOS-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install npm dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Generate test bindings
        run: bun specs

      - name: Install Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 1.5G
          key: ${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-Default-ccache-example-ios
      - name: Setup ccache behavior
        run: |
          {
            echo "CCACHE_SLOPPINESS=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros"
            echo "CCACHE_FILECLONE=true"
            echo "CCACHE_DEPEND=true"
            echo "CCACHE_INODECACHE=true"
          } >> "$GITHUB_ENV"

      - name: Setup Ruby (bundle)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7.2
          bundler-cache: true
          working-directory: tests/react-native/apps/example

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer"

      - name: Restore Pods cache
        uses: actions/cache@v6
        with:
          path: tests/react-native/apps/example/ios/Pods
          key: ${{ runner.os }}-${{ runner.arch }}-pods-${{ hashFiles('bun.lock', 'tests/react-native/apps/example/Gemfile.lock', 'tests/react-native/apps/example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pods-
      - name: Install Pods
        working-directory: tests/react-native/apps/example
        run: bun pods

      - name: Restore DerivedData cache
        uses: actions/cache@v6
        with:
          path: tests/react-native/apps/example/ios/build
          key: ${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-Default-dd-${{ hashFiles('bun.lock', 'tests/react-native/apps/example/Gemfile.lock', 'tests/react-native/apps/example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-Default-dd-

      - name: Build React Native iOS app
        working-directory: tests/react-native/apps/example/ios
        run: |
          set -o pipefail
          xcodebuild \
            C_COMPILER_LAUNCHER="$(command -v ccache)" \
            CLANG_ENABLE_EXPLICIT_MODULES_WITH_COMPILER_LAUNCHER=YES \
            -derivedDataPath build -UseModernBuildSystem=YES \
            -workspace NitroExample.xcworkspace \
            -scheme NitroExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -showBuildTimingSummary \
            ARCHS=arm64 \
            build \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Install Watchman
        run: brew install watchman

      - name: Run Harness E2E tests
        uses: callstackincubator/react-native-harness@v1.5.0
        with:
          runner: ios
          projectRoot: tests/react-native/apps/example
          app: ios/build/Build/Products/Debug-iphonesimulator/NitroExample.app
          packageManager: bun

      - name: Print native crash reports
        if: failure()
        working-directory: tests/react-native/apps/example
        shell: bash
        run: |
          # Harness only extracts crash logs it classifies as native crashes,
          # so also print the simulator's own crash reports.
          {
            [ -d .harness/crash-reports ] && find .harness/crash-reports -type f
            find ~/Library/Logs/DiagnosticReports -name 'NitroExample*.ips' 2>/dev/null
          } | sort | while read -r report; do
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done
