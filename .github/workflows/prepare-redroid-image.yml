name: Prepare Redroid image

on:
  workflow_call:
    outputs:
      image_ref:
        description: Immutable reference to the prepared Redroid image
        value: ${{ jobs.prepare.outputs.image_ref }}
      kernel_releases:
        description: Exact runner kernels supported by the prepared ashmem modules
        value: ${{ jobs.prepare.outputs.kernel_releases }}

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare Redroid with ashmem
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
      kernel_releases: ${{ steps.kernel.outputs.kernel_releases }}
    steps:
      - name: Record the target kernels
        id: kernel
        run: |
          date +%s%3N > "$RUNNER_TEMP/redroid-image-preparation-started-ms"
          kernel_releases="7.0.0-1017-azure 7.0.0-1019-azure"
          printf 'kernel_releases=%s\n' "$kernel_releases" >> "$GITHUB_OUTPUT"
          printf 'KERNEL_RELEASES=%s\n' "$kernel_releases" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Check out the pinned ashmem source
        uses: actions/checkout@v7
        with:
          repository: remote-android/redroid-modules
          ref: 1ec533fa82ecb2d34a45141a10fbc7b4d80c1d7a
          path: .redroid-module-src
          fetch-depth: 1

      - name: Install matching kernel headers and compiler
        run: |
          sudo apt-get update
          read -r -a target_kernels <<< "$KERNEL_RELEASES"
          kernel_packages=()
          for kernel_release in "${target_kernels[@]}"; do
            kernel_packages+=("linux-headers-$kernel_release")
          done
          sudo apt-get install --yes --no-install-recommends "${kernel_packages[@]}" gcc-15 libelf-dev

      - name: Build and stage the ashmem modules
        working-directory: .redroid-module-src/ashmem
        run: |
          image_context="$GITHUB_WORKSPACE/scripts/ci/redroid-image"
          mkdir -p "$image_context/modules"
          : > "$image_context/modules/SHA256SUMS"
          read -r -a target_kernels <<< "$KERNEL_RELEASES"
          for kernel_release in "${target_kernels[@]}"; do
            make KDIR="/lib/modules/$kernel_release/build" clean
            make KDIR="/lib/modules/$kernel_release/build" CC=gcc-15
            test -s ashmem_linux.ko
            vermagic=$(modinfo --field vermagic ashmem_linux.ko)
            module_kernel="${vermagic%% *}"
            test "$module_kernel" = "$kernel_release"
            module_hash_line=$(sha256sum ashmem_linux.ko)
            module_sha256="${module_hash_line%% *}"
            module_dir="$image_context/modules/$kernel_release"
            mkdir -p "$module_dir"
            cp ashmem_linux.ko "$module_dir/ashmem_linux.ko"
            printf '%s  %s/ashmem_linux.ko\n' "$module_sha256" "$kernel_release" >> "$image_context/modules/SHA256SUMS"
          done

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish the prepared image
        id: publish
        run: |
          image_tag="ghcr.io/margelo/nitro-harness-redroid:android16-ashmem-1ec533f-ubuntu26"
          docker build --platform linux/amd64 \
            --tag "$image_tag" scripts/ci/redroid-image
          docker push "$image_tag"
          image_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image_tag")
          printf 'image_ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"
          read -r started_ms < "$RUNNER_TEMP/redroid-image-preparation-started-ms"
          finished_ms=$(date +%s%3N)
          duration_ms=$((finished_ms - started_ms))
          {
            printf '### Prepared Redroid image\n\n'
            printf 'Image: %s\n\n' "$image_ref"
            printf 'Tag: %s\n\n' "$image_tag"
            printf 'Kernels: %s\n\n' "$KERNEL_RELEASES"
            printf 'ashmem source: 1ec533fa82ecb2d34a45141a10fbc7b4d80c1d7a\n\n'
            printf 'ashmem SHA-256 checksums:\n\n```\n'
            cat scripts/ci/redroid-image/modules/SHA256SUMS
            printf '```\n\n'
            printf 'One-time preparation: %s ms, excluded from Harness measurements.\n' "$duration_ms"
          } >> "$GITHUB_STEP_SUMMARY"
