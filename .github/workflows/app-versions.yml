name: App Version Alignment

on:
  pull_request:
    paths:
      - '.github/workflows/app-versions.yml'
      - 'scripts/check-app-versions*.mjs'
      - 'package.json'
      - 'apps/*/package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-versions.yml'
      - 'scripts/check-app-versions*.mjs'
      - 'package.json'
      - 'apps/*/package.json'

permissions:
  contents: read

jobs:
  app-versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Test the version checker
        run: bun test scripts/check-app-versions.test.mjs
      - name: Check app versions
        run: bun run check:app-versions
