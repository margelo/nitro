name: Lint Swift

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/lint-swift.yml'
      - 'scripts/swift-format.sh'
      - 'config/**'
      - '**/*.swift'

jobs:
  lint:
    name: Format Swift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Run swift format
        run: bun run lint-swift

      - name: Verify no files have changed after format
        run: git diff --exit-code HEAD -- . ':(exclude)bun.lock'

