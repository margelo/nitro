name: Build Android (Release)

on:
  release:
    types: [published]
  pull_request:
    paths:
      - '.github/workflows/build-android-release.yml'

jobs:
  build_release:
    name: Build Android Example App (release, new architecture)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Install npm dependencies (bun)
        run: bun install

      - name: Setup JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'zulu'
          java-version: 17
          java-package: jdk

      - name: Set minSdk in build.gradle to 26
        run: sed -i "s/minSdkVersion = 24/minSdkVersion = 26/g" apps/example/android/build.gradle

      - name: Run Gradle Build for apps/example/android/
        working-directory: apps/example/android
        run: |
          ./gradlew clean :app:assembleRelease --no-daemon --no-build-cache

      - name: Upload APK to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          ASSET_NAME="NitroExample-${RELEASE_TAG}.apk"
          mv apps/example/android/app/build/outputs/apk/release/app-release.apk "$ASSET_NAME"
          gh release upload "$RELEASE_TAG" "$ASSET_NAME" --repo "$GITHUB_REPOSITORY"

      # Gradle cache doesn't like daemons
      - name: Stop Gradle Daemon
        working-directory: apps/example/android
        run: ./gradlew --stop
