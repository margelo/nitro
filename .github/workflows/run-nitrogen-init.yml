name: Test Nitrogen init command

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string
  pull_request:
    paths:
      - 'packages/nitrogen/**'
      - 'packages/nitro-core/**'
      - 'packages/react-native-nitro-modules/**'
      - 'packages/template/**'
      - 'config/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/run-nitrogen-init.yml'

jobs:
  lint:
    name: Run Nitrogen init command
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install npm dependencies (bun)
        run: |
          bun install --frozen-lockfile
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run nitrogen init outside the checkout
        working-directory: ${{ runner.temp }}
        run: bun run --bun nitrogen init react-native-math

      - name: Check that all template placeholders were replaced
        working-directory: ${{ runner.temp }}/react-native-math
        run: |
          if find . -name '*$$*' | grep .; then
            echo "::error::File names above still contain \$\$ template placeholders"
            exit 1
          fi
          if grep -rnIF '$$' .; then
            echo "::error::File contents above still contain \$\$ template placeholders"
            exit 1
          fi
