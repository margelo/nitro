name: Test Nitrogen init command

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string
  pull_request:
    paths:
      - 'packages/nitrogen/**'
      - 'packages/nitro-core/**'
      - 'packages/react-native-nitro-modules/**'
      - 'packages/template/**'
      - 'config/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/run-nitrogen-init.yml'

jobs:
  lint:
    name: Run Nitrogen init command
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install npm dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Run nitrogen init outside the checkout
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/packages/nitrogen/lib/index.js" init react-native-math
