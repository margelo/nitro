name: Build React Native iOS

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/build-ios.yml'
      - 'Package.swift'
      - 'Package.resolved'
      - 'packages/nitro-core/**'
      - 'packages/nitrogen/**'
      - 'packages/react-native-nitro-modules/**'
      - 'tests/react-native/**'
      - 'scripts/sync-core.mjs'
      - 'scripts/core-package.mjs'
      - 'scripts/set-version.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'scripts/releases/**'
      - 'config/**'

env:
  XCODE_VERSION: '27.1'
  IOS_SIMULATOR_DESTINATION: 'generic/platform=iOS Simulator'

jobs:
  build:
    name: Build iOS Example App
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install npm dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Generate test bindings
        run: bun specs

      - name: Install Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 1.5G
          key: ${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-spm-ccache-example-ios
      - name: Setup ccache behavior
        run: |
          {
            echo "CCACHE_SLOPPINESS=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros"
            echo "CCACHE_FILECLONE=true"
            echo "CCACHE_DEPEND=true"
            echo "CCACHE_INODECACHE=true"
          } >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          xcrun swift --version

      - name: Resolve Swift packages
        working-directory: tests/react-native/apps/example
        run: bun spm

      - name: Restore DerivedData cache
        uses: actions/cache@v6
        with:
          path: tests/react-native/apps/example/ios/build
          key: ${{ runner.os }}-${{ runner.arch }}-spm-xcode${{ env.XCODE_VERSION }}-dd-${{ hashFiles('bun.lock', '**/Package.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-xcode${{ env.XCODE_VERSION }}-dd-

      - name: Build App
        working-directory: tests/react-native/apps/example/ios
        run: |
          set -o pipefail
          xcodebuild \
            C_COMPILER_LAUNCHER="$(command -v ccache)" \
            CLANG_ENABLE_EXPLICIT_MODULES_WITH_COMPILER_LAUNCHER=YES \
            -derivedDataPath build -UseModernBuildSystem=YES \
            -project NitroExample.xcodeproj \
            -scheme NitroExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination '${{ env.IOS_SIMULATOR_DESTINATION }}' \
            -showBuildTimingSummary \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            build \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
