name: Build iOS

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ios.yml'
      - 'apps/example/ios/**'
      - '**/nitrogen/generated/shared/**'
      - '**/nitrogen/generated/ios/**'
      - 'packages/react-native-nitro-test/cpp/**'
      - 'packages/react-native-nitro-test/ios/**'
      - 'packages/react-native-nitro-test-external/cpp/**'
      - 'packages/react-native-nitro-test-external/ios/**'
      - 'packages/react-native-nitro-modules/cpp/**'
      - 'packages/react-native-nitro-modules/ios/**'
      - '**/Podfile.lock'
      - '**/*.podspec'
      - '**/react-native.config.js'
      - '**/nitro.json'
  pull_request:
    paths:
      - '.github/workflows/build-ios.yml'
      - 'apps/example/ios/**'
      - '**/nitrogen/generated/shared/**'
      - '**/nitrogen/generated/ios/**'
      - 'packages/react-native-nitro-test/cpp/**'
      - 'packages/react-native-nitro-test/ios/**'
      - 'packages/react-native-nitro-test-external/cpp/**'
      - 'packages/react-native-nitro-test-external/ios/**'
      - 'packages/react-native-nitro-modules/cpp/**'
      - 'packages/react-native-nitro-modules/ios/**'
      - '**/Podfile.lock'
      - '**/*.podspec'
      - '**/react-native.config.js'
      - '**/nitro.json'

env:
  XCODE_VERSION: '26.5'
  IOS_SIMULATOR_DESTINATION: 'generic/platform=iOS Simulator'

jobs:
  build:
    name: Build iOS Example App
    runs-on: macOS-26
    strategy:
      matrix:
        include:
          - name: static_frameworks
            use_frameworks: static
          - name: no_frameworks
            use_frameworks: ""   # intentionally unset
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Set USE_FRAMEWORKS
        if: matrix.use_frameworks != ''
        run: echo "USE_FRAMEWORKS=${{ matrix.use_frameworks }}" >> "$GITHUB_ENV"

      - name: Install npm dependencies (bun)
        run: bun install

      - name: Install Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 1.5G
          key: ${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-${{ matrix.use_frameworks }}-ccache-example-ios
      - name: Setup ccache behavior
        run: |
          {
            echo "CCACHE_SLOPPINESS=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros"
            echo "CCACHE_FILECLONE=true"
            echo "CCACHE_DEPEND=true"
            echo "CCACHE_INODECACHE=true"
          } >> "$GITHUB_ENV"

      - name: Setup Ruby (bundle)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7.2
          bundler-cache: true
          working-directory: apps/example

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s "/Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer"

      - name: Restore Pods cache
        uses: actions/cache@v6
        with:
          path: apps/example/ios/Pods
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.use_frameworks }}-pods-${{ hashFiles('bun.lock', 'apps/example/Gemfile.lock', 'apps/example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.use_frameworks }}-pods-
      - name: Install Pods
        working-directory: apps/example
        run: bun pods

      - name: Restore DerivedData cache
        uses: actions/cache@v6
        with:
          path: apps/example/ios/build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.use_frameworks }}-xcode${{ env.XCODE_VERSION }}-dd-${{ hashFiles('bun.lock', 'apps/example/Gemfile.lock', 'apps/example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.use_frameworks }}-xcode${{ env.XCODE_VERSION }}-dd-

      - name: Build App
        working-directory: apps/example/ios
        run: |
          set -o pipefail
          xcodebuild \
            C_COMPILER_LAUNCHER="$(command -v ccache)" \
            CLANG_ENABLE_EXPLICIT_MODULES_WITH_COMPILER_LAUNCHER=YES \
            -derivedDataPath build -UseModernBuildSystem=YES \
            -workspace NitroExample.xcworkspace \
            -scheme NitroExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination '${{ env.IOS_SIMULATOR_DESTINATION }}' \
            -showBuildTimingSummary \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            build \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
