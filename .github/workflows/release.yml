name: Release Nitro

on:
  push:
    branches: [main, v1]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version, for example 0.37.2 or 1.0.0-alpha.1'
        required: true
        type: string
      npm-tag:
        description: 'Optional npm tag (defaults to latest, beta, rc, etc.)'
        required: false
        type: string
      dry-run:
        description: 'Build and validate without committing or publishing'
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release commit
    if: >-
      github.repository == 'margelo/nitro' && !github.event.deleted && ((github.event_name == 'release' && startsWith(github.ref,
      'refs/tags/')) ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref ==
      'refs/heads/v1')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      test-runtime-ios: ${{ steps.native.outputs.test-runtime-ios }}
      test-runtime-android: ${{ steps.native.outputs.test-runtime-android }}
      harness-ios: ${{ steps.native.outputs.harness-ios }}
      harness-android: ${{ steps.native.outputs.harness-android }}
      branch:
        ${{ github.event_name == 'release' && (startsWith(github.event.release.tag_name, 'v1.') && contains(github.event.release.tag_name,
        '-alpha.') && 'v1' || 'main') || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve release source
        id: resolve
        env:
          RELEASE_BRANCH:
            ${{ github.event_name == 'release' && (startsWith(github.event.release.tag_name, 'v1.') &&
            contains(github.event.release.tag_name, '-alpha.') && 'v1' || 'main') || github.ref_name }}
          RELEASE_MODE: ${{ github.event_name == 'push' && 'nightly' || 'manual' }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_EVENT_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: node scripts/releases/ci-ref.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Select native checks
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_VALIDATED_COMMIT: ${{ steps.resolve.outputs.commit }}
        run: bun scripts/releases/ci-native.mjs

  build:
    needs: resolve
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  format-prettier:
    needs: resolve
    uses: ./.github/workflows/format-prettier.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  lint-cpp:
    needs: resolve
    uses: ./.github/workflows/lint-cpp.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  lint-swift:
    needs: resolve
    uses: ./.github/workflows/lint-swift.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  lint-kotlin:
    needs: resolve
    uses: ./.github/workflows/lint-kotlin.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  lint-typescript:
    needs: resolve
    uses: ./.github/workflows/lint-typescript.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  run-nitrogen:
    needs: resolve
    uses: ./.github/workflows/run-nitrogen.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  run-nitrogen-init:
    needs: resolve
    uses: ./.github/workflows/run-nitrogen-init.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  check-release:
    needs: resolve
    uses: ./.github/workflows/check-release.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  test-runtime-ios:
    needs: resolve
    if: needs.resolve.outputs.test-runtime-ios == 'true'
    uses: ./.github/workflows/test-runtime-ios.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  test-runtime-android:
    needs: resolve
    if: needs.resolve.outputs.test-runtime-android == 'true'
    uses: ./.github/workflows/test-runtime-android.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  harness-ios:
    needs: resolve
    if: needs.resolve.outputs.harness-ios == 'true'
    uses: ./.github/workflows/harness-ios.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  harness-android:
    needs: resolve
    if: needs.resolve.outputs.harness-android == 'true'
    uses: ./.github/workflows/harness-android.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  release:
    environment: npm
    needs:
      - resolve
      - build
      - format-prettier
      - lint-cpp
      - lint-swift
      - lint-kotlin
      - lint-typescript
      - run-nitrogen
      - run-nitrogen-init
      - check-release
      - test-runtime-ios
      - test-runtime-android
      - harness-ios
      - harness-android
    if: >-
      !cancelled() && needs.resolve.result == 'success' && needs.build.result == 'success' && needs.format-prettier.result == 'success' &&
      needs.lint-cpp.result == 'success' && needs.lint-swift.result == 'success' && needs.lint-kotlin.result == 'success' &&
      needs.lint-typescript.result == 'success' && needs.run-nitrogen.result == 'success' && needs.run-nitrogen-init.result == 'success' &&
      needs.check-release.result == 'success' && ((needs.resolve.outputs.test-runtime-ios == 'true' && needs.test-runtime-ios.result ==
      'success') || (needs.resolve.outputs.test-runtime-ios == 'false' && needs.test-runtime-ios.result == 'skipped')) &&
      ((needs.resolve.outputs.test-runtime-android == 'true' && needs.test-runtime-android.result == 'success') ||
      (needs.resolve.outputs.test-runtime-android == 'false' && needs.test-runtime-android.result == 'skipped')) &&
      ((needs.resolve.outputs.harness-ios == 'true' && needs.harness-ios.result == 'success') || (needs.resolve.outputs.harness-ios ==
      'false' && needs.harness-ios.result == 'skipped')) && ((needs.resolve.outputs.harness-android == 'true' &&
      needs.harness-android.result == 'success') || (needs.resolve.outputs.harness-android == 'false' && needs.harness-android.result ==
      'skipped')) && (needs.resolve.outputs.branch == 'main' || needs.resolve.outputs.branch == 'v1')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: nitro-release
      cancel-in-progress: false
      queue: max
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global npm@11.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Build, validate and release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ needs.resolve.outputs.branch }}
          RELEASE_MODE: ${{ github.event_name == 'push' && 'nightly' || 'manual' }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NPM_TAG: ${{ inputs.npm-tag }}
          RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          RELEASE_EVENT_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          RELEASE_VALIDATED_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: bun release:ci

  # Releases created with GITHUB_TOKEN do not trigger other release workflows.
  ios-artifacts:
    needs: release
    if: >-
      !cancelled() && needs.release.result == 'success' && needs.release.outputs.tag != '' && github.event_name != 'release'
    permissions:
      contents: write
    uses: ./.github/workflows/build-ios-release.yml
    with:
      release-tag: ${{ needs.release.outputs.tag }}

  android-artifacts:
    needs: release
    if: >-
      !cancelled() && needs.release.result == 'success' && needs.release.outputs.tag != '' && github.event_name != 'release'
    permissions:
      contents: write
    uses: ./.github/workflows/build-android-release.yml
    with:
      release-tag: ${{ needs.release.outputs.tag }}
