name: Check runtime test fixtures

on:
  push:
    branches: [main, core-split]
    paths:
      - "tests/runtime/**"
      - "packages/nitro-core/**"
      - "packages/nitrogen/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/test-runtime-js.yml"
  pull_request:
    paths:
      - "tests/runtime/**"
      - "packages/nitro-core/**"
      - "packages/nitrogen/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/test-runtime-js.yml"

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test:prepare
      - name: Verify generated bindings are committed
        run: |
          git diff --exit-code -- tests/runtime/nitrogen/generated
          test -z "$(git ls-files --others --exclude-standard tests/runtime/nitrogen/generated)"
