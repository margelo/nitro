name: Lint Kotlin

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/lint-kotlin.yml'
      - 'scripts/kotlin-format.sh'
      - 'config/**'
      - '**/*.kt'

jobs:
  lint:
    name: Format Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/latest/download/ktlint
          chmod a+x ktlint
          sudo mv ktlint /usr/local/bin/

      - name: Run ktlint
        run: bun run lint-kotlin

      - name: Verify no files have changed after format
        run: git diff --exit-code HEAD -- . ':(exclude)bun.lock'

