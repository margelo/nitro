name: Build React Native iOS (Release)

on:
  workflow_call:
    inputs:
      release-tag:
        description: Published tag to build and attach app artifacts to
        required: true
        type: string
  release:
    types: [published]
  pull_request:
    paths:
      - '.github/workflows/build-ios-release.yml'
      - 'Package.swift'
      - 'Package.resolved'
      - 'packages/nitro-core/**'
      - 'packages/nitrogen/**'
      - 'packages/react-native-nitro-modules/**'
      - 'tests/react-native/**'
      - 'scripts/sync-core.mjs'
      - 'scripts/core-package.mjs'
      - 'scripts/set-version.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'scripts/releases/**'
      - 'config/**'

jobs:
  # TODO: Remove this CocoaPods job once React Native defaults to Swift Package Manager.
  build_cocoapods:
    name: Build iOS Example App (CocoaPods, ${{ matrix.configuration }})
    runs-on: xcode-27
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3.3.0

      - name: Install npm dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Generate test bindings
        run: bun specs

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          xcrun swift --version

      - name: Install CocoaPods
        run: gem install cocoapods -v 1.16.2 --no-document

      - name: Remove SwiftPM integration
        working-directory: tests/react-native/apps/example
        run: bun spm deinit

      - name: Install pods
        working-directory: tests/react-native/apps/example/ios
        run: pod install

      - name: Build App (CocoaPods, Simulator)
        working-directory: tests/react-native/apps/example/ios
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          set -o pipefail
          xcodebuild \
            -derivedDataPath build-cocoapods \
            -workspace NitroExample.xcworkspace \
            -scheme NitroExample \
            -sdk iphonesimulator \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS Simulator' \
            -showBuildTimingSummary \
            ARCHS=arm64 \
            build \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

  build_release:
    name: Build iOS Example App (release, new architecture)
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install npm dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Generate test bindings
        run: bun specs

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          xcrun swift --version
      - name: Resolve Swift packages
        working-directory: tests/react-native/apps/example
        run: bun spm

      - name: Build App (Release, Simulator)
        working-directory: tests/react-native/apps/example/ios
        run: |
          set -o pipefail
          xcodebuild \
            -derivedDataPath build \
            -project NitroExample.xcodeproj \
            -scheme NitroExample \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -showBuildTimingSummary \
            clean \
            build \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Package .app for Simulator
        run: |
          cd tests/react-native/apps/example/ios/build/Build/Products/Release-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/NitroExample-Release-Simulator.zip" NitroExample.app

      - name: Upload .app to Release
        if: inputs.release-tag != '' || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
        run: |
          ASSET_NAME="NitroExample-Simulator-${RELEASE_TAG}.app.zip"
          EXISTING_ASSETS=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if printf '%s\n' "$EXISTING_ASSETS" | grep -Fxq -- "$ASSET_NAME"; then
            echo "Release asset $ASSET_NAME already exists; keeping it."
          else
            mv NitroExample-Release-Simulator.zip "$ASSET_NAME"
            gh release upload "$RELEASE_TAG" "$ASSET_NAME" --repo "$GITHUB_REPOSITORY"
          fi
