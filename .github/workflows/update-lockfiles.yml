name: 'Update Lockfiles (bun.lock + Podfile.lock)'

on:
  push:
    branches:
      - main
    paths:
      - '**/package.json'
      - 'bun.lock'
      - 'scripts/sync-core.mjs'
      - 'scripts/core-package.mjs'
      - '.github/workflows/update-lockfiles.yml'
      - 'tests/react-native/apps/**/Podfile'
      - 'tests/react-native/apps/**/Gemfile'
  pull_request:
    paths:
      - '**/package.json'
      - 'bun.lock'
      - 'scripts/sync-core.mjs'
      - 'scripts/core-package.mjs'
      - '.github/workflows/update-lockfiles.yml'
      - 'tests/react-native/apps/**/Podfile'
      - 'tests/react-native/apps/**/Gemfile'

permissions:
  contents: write

jobs:
  update-lockfiles:
    name: "Update lockfiles (Podfile.lock)"
    if: github.actor == 'dependabot[bot]'
    runs-on: macOS-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Ruby (bundle)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7.2
          bundler-cache: true
          working-directory: tests/react-native/apps/example/ios

      - name: Select Xcode 26.2
        run: sudo xcode-select -s "/Applications/Xcode_26.2.app/Contents/Developer"

      - run: |
          bun install

          cd tests/react-native/apps/example
          bundle install
          bun pods
          cd "$GITHUB_WORKSPACE"

          git add bun.lock
          git add tests/react-native/apps/example/ios/Podfile.lock
          git add tests/react-native/apps/example/Gemfile.lock

          git config --global user.name 'dependabot[bot]'
          git config --global user.email 'dependabot[bot]@users.noreply.github.com'
          git commit --amend --no-edit
          git push --force
