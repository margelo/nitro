name: 'Update Lockfiles (bun.lock + Package.resolved)'

on:
  push:
    branches:
      - main
    paths:
      - '**/package.json'
      - 'bun.lock'
      - 'scripts/sync-core.mjs'
      - 'scripts/core-package.mjs'
      - '.github/workflows/update-lockfiles.yml'
      - '**/Package.swift'
      - 'Package.resolved'
  pull_request:
    paths:
      - '**/package.json'
      - 'bun.lock'
      - 'scripts/sync-core.mjs'
      - 'scripts/core-package.mjs'
      - '.github/workflows/update-lockfiles.yml'
      - '**/Package.swift'
      - 'Package.resolved'

permissions:
  contents: write

jobs:
  update-lockfiles:
    name: "Update lockfiles (SwiftPM)"
    if: github.actor == 'dependabot[bot]'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          xcrun swift --version

      - run: |
          bun install

          bun example spm
          xcodebuild -resolvePackageDependencies -project tests/react-native/apps/example/ios/NitroExample.xcodeproj -scheme NitroExample
          bun benchmark spm
          xcodebuild -resolvePackageDependencies -project tests/react-native/apps/benchmark/ios/NitroBenchmark.xcodeproj -scheme NitroBenchmark

          git add bun.lock Package.resolved
          git add tests/react-native/apps/*/ios/*.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

          git config --global user.name 'dependabot[bot]'
          git config --global user.email 'dependabot[bot]@users.noreply.github.com'
          git commit --amend --no-edit
          git push --force
