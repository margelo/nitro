name: Build React Native Android

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android.yml'
      - 'packages/nitro-core/**'
      - 'packages/nitrogen/**'
      - 'packages/react-native-nitro-modules/**'
      - 'tests/react-native/**'
      - 'scripts/sync-core.mjs'
      - 'scripts/core-package.mjs'
      - 'scripts/set-version.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'scripts/releases/**'
      - 'config/**'
  pull_request:
    paths:
      - '.github/workflows/build-android.yml'
      - 'packages/nitro-core/**'
      - 'packages/nitrogen/**'
      - 'packages/react-native-nitro-modules/**'
      - 'tests/react-native/**'
      - 'scripts/sync-core.mjs'
      - 'scripts/core-package.mjs'
      - 'scripts/set-version.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'scripts/releases/**'
      - 'config/**'

env:
  # Build a single ABI in CI to reduce native compile time.
  TARGET_ANDROID_ARCH: x86_64

jobs:
  build:
    name: Build Android Example App
    runs-on: ubuntu-latest
    strategy:
      matrix:
        min-sdk:
          - '24'
          - '26'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install npm dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Generate React Native test bindings
        run: bun specs

      - name: Set minSdk in build.gradle
        run: sed -i "s/minSdkVersion = 24/minSdkVersion = ${{ matrix.min-sdk }}/g" tests/react-native/apps/example/android/build.gradle

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17
          java-package: jdk

      - name: Restore Gradle/CMake cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            tests/react-native/apps/example/android/.gradle
            tests/react-native/apps/example/android/app/.cxx
          key: ${{ runner.os }}-gradle-${{ matrix.min-sdk }}-${{ env.TARGET_ANDROID_ARCH }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.min-sdk }}-${{ env.TARGET_ANDROID_ARCH }}-
            ${{ runner.os }}-gradle-
      - name: Run Gradle Build for tests/react-native/apps/example/android/
        working-directory: tests/react-native/apps/example/android
        run: ./gradlew :app:assembleDebug --no-daemon --build-cache -PreactNativeArchitectures=${{ env.TARGET_ANDROID_ARCH }}

      # Gradle cache doesn't like daemons
      - name: Stop Gradle Daemon
        working-directory: tests/react-native/apps/example/android
        run: ./gradlew --stop
