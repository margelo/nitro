name: Lint TypeScript

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/lint-typescript.yml'
      - 'config/**'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - 'eslint.config.mjs'
      - '**/*.jsx'
      - '**/*.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '**/package.json'
  pull_request:
    paths:
      - '.github/workflows/lint-typescript.yml'
      - 'config/**'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - 'eslint.config.mjs'
      - '**/*.jsx'
      - '**/*.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '**/package.json'

jobs:
  tsc:
    name: Compile TypeScript (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install npm dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Run TypeScript (tsc)
        run: bun typecheck

  lint:
    name: Lint TypeScript (eslint, prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install npm dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Run ESLint CI in example
        working-directory: tests/react-native/apps/example
        run: bun lint-ci
      - name: Run ESLint CI in benchmark
        working-directory: tests/react-native/apps/benchmark
        run: bun lint-ci
      - name: Run ESLint CI in react-native-nitro-test-external
        working-directory: tests/react-native/packages/react-native-nitro-test-external
        run: bun lint-ci
      - name: Run ESLint CI in react-native-nitro-test
        working-directory: tests/react-native/packages/react-native-nitro-test
        run: bun lint-ci
      - name: Run ESLint CI in react-native-nitro-modules
        working-directory: packages/react-native-nitro-modules
        run: bun lint-ci
      - name: Run ESLint CI in nitrogen
        working-directory: packages/nitrogen
        run: bun lint-ci
      - name: Run ESLint CI in nitro-core
        working-directory: packages/nitro-core
        run: bun lint-ci

      - name: Run ESLint with auto-fix in example
        working-directory: tests/react-native/apps/example
        run: bun lint
      - name: Run ESLint with auto-fix in benchmark
        working-directory: tests/react-native/apps/benchmark
        run: bun lint
      - name: Run ESLint with auto-fix in react-native-nitro-test-external
        working-directory: tests/react-native/packages/react-native-nitro-test-external
        run: bun lint
      - name: Run ESLint with auto-fix in react-native-nitro-test
        working-directory: tests/react-native/packages/react-native-nitro-test
        run: bun lint
      - name: Run ESLint with auto-fix in react-native-nitro-modules
        working-directory: packages/react-native-nitro-modules
        run: bun lint
      - name: Run ESLint with auto-fix in nitrogen
        working-directory: packages/nitrogen
        run: bun lint
      - name: Run ESLint with auto-fix in nitro-core
        working-directory: packages/nitro-core
        run: bun lint

      - name: Verify no files have changed after auto-fix
        run: git diff --exit-code HEAD -- . ':(exclude)bun.lock'
